<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Den</title>
    <link rel="icon" href="images/favicon-cupcake.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <header>
  <nav>
        <ul class="nav" >
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="product.html">Products</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <!-- Logo-->
    <div class="logo">
        <img src="images/chocolate-den-logo.png" alt="Chocolate Den Logo" width="250" height="50">

    </div>
    </header>
  
    <div class="hero" style="text-align: center; margin-top: 50px; background-image: url('images/hero-chocolate-chip-muffins.jpg'); background-size: cover; background-position: center; padding: 100px 20px; color: black; height: 400px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1>Welcome to Chocolate Den</h1>
        <p>Discover the world of exquisite chocolates!</p>
        <button class="shop-now" >Shop Now</button>
    </div>
    <!--Product section-->
    <div class="product-row" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 50px 0;">

  <div class="product-card">
    <img src="products/disposable-piping-bag.jpg" alt="Piping Bag">
    <h3>Piping Bag</h3>
    <p class="price">R50.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="products/paper-muffin-cup-liners.jpg" alt="Muffin Liner">
    <h3>Muffin Liner</h3>
    <p class="price">R10.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="products/bakels-pettinice-blue-icing.jpg" alt="Icing">
    <h3>Icing</h3>
    <p class="price">R80.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="products/clear-pvc-gift-box.jpg" alt="PVC Box">
    <h3>PVC Box</h3>
    <p class="price">R100.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>

  <div class="product-card">
    <img src="products/banana-flavouring-oil.jpg" alt="Flavouring Oil">
    <h3>Flavouring Oil</h3>
    <p class="price">R70.00</p>
    <button class="add-to-cart">Add to Cart</button>
  </div>
  

</div>
<footer>
    <p>&copy; 2026 Chocolate Den. All rights reserved.</p>
  </footer>
